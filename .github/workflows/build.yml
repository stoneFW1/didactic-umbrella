name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          ZIP=$(find . -name 'SlimePet.zip' -not -path './.git/*' | head -1)
          echo "找到压缩包: $ZIP"
          test -n "$ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          find src -maxdepth 3 -type d | sort

      - name: Build debug APK
        working-directory: src/SlimePet
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slimepet-debug
          path: src/SlimePet/app/build/outputs/apk/debug/*.apk
